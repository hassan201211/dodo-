name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare dependencies and engine stubs
        working-directory: app
        run: |
          mkdir -p Tools Generated Build Resources GeneratedResources
          
          # 1. Download WABT runtime headers & C files
          if [ ! -d "Tools/wabt-1.0.42" ]; then
            curl -L https://github.com/WebAssembly/wabt/releases/download/1.0.42/wabt-1.0.42-macos-arm64.tar.gz -o Tools/wabt.tar.gz
            tar -xzf Tools/wabt.tar.gz -C Tools
          fi

          # 2. Clone SIMDe
          if [ ! -d "Tools/simde" ]; then
            git clone --depth 1 --branch v0.8.2 https://github.com/simd-everywhere/simde.git Tools/simde
          fi

          # 3. Build native audio & network libraries (opus & blink)
          python3 Scripts/build_opus.py --sdk iphoneos
          python3 Scripts/build_blink.py --sdk iphoneos

          # 4. Generate standalone C headers & stubs so IPA builds without a game server
          python3 - << 'EOF'
          import re
          from pathlib import Path

          src_text = "\n".join(
              p.read_text(errors="ignore")
              for p in Path("Source").rglob("*")
              if p.suffix in (".c", ".h", ".m", ".mm", ".inc")
          )

          funcs = sorted(set(re.findall(r"\b((?:w2c|wasm2c)_game_[A-Za-z0-9_]+)\b", src_text)))
          ptr_funcs = set(re.findall(r"\*\s*\w+\s*=\s*((?:w2c|wasm2c)_game_[A-Za-z0-9_]+)\b", src_text))
          ptr_funcs.add("w2c_game_0x5F_indirect_function_table")

          h_lines = [
              "#pragma once",
              "#include <stdint.h>",
              "#include <stdbool.h>",
              '#include "wasm-rt.h"',
              "typedef struct w2c_game { uint8_t _unused; } w2c_game;",
          ]
          c_lines = [
              '#include "game.h"',
              "#include <stddef.h>",
          ]

          for fn in funcs:
              if fn in ptr_funcs:
                  h_lines.append(f"void *{fn}(void *a, ...);")
                  c_lines.append(f"void *{fn}(void *a, ...) {{ return NULL; }}")
              else:
                  h_lines.append(f"uint64_t {fn}(void *a, ...);")
                  c_lines.append(f"uint64_t {fn}(void *a, ...) {{ return 0; }}")

          Path("Generated/game.h").write_text("\n".join(h_lines) + "\n")
          Path("Generated/game.c").write_text("\n".join(c_lines) + "\n")
          Path("Resources/manifest.json").write_text("{}\n")
          Path("GeneratedResources/shader-reflection.jsonl").write_text("")
          EOF

          # 5. Generate Xcode project
          xcodegen generate --spec project.yml

      - name: Build unsigned IPA
        working-directory: app
        run: |
          xcodebuild -project PlayGTA5Native.xcodeproj \
            -scheme PlayGTA5Native \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath Build/Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS=App/Free.entitlements \
            build

          APP="Build/Release/Build/Products/Release-iphoneos/PlayGTA5Native.app"
          codesign --force --sign - --entitlements App/Free.entitlements --generate-entitlement-der "$APP"
          mkdir -p Build/IPA/Payload
          ditto "$APP" Build/IPA/Payload/PlayGTA5Native.app
          (cd Build/IPA && zip -qry ../../GTA5Port.ipa Payload)

      - name: Upload GTA5Port.ipa
        uses: actions/upload-artifact@v4
        with:
          name: GTA5Port-iOS
          path: app/GTA5Port.ipa
