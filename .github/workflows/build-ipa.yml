name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare dependencies and engine stubs
        working-directory: app
        run: |
          mkdir -p Tools Generated Build Resources GeneratedResources

          if [ ! -d "Tools/wabt-1.0.42" ]; then
            curl -L https://github.com/WebAssembly/wabt/releases/download/1.0.42/wabt-1.0.42-macos-arm64.tar.gz -o Tools/wabt.tar.gz
            tar -xzf Tools/wabt.tar.gz -C Tools
          fi

          if [ ! -d "Tools/simde" ]; then
            git clone --depth 1 --branch v0.8.2 https://github.com/simd-everywhere/simde.git Tools/simde
          fi

          if [ ! -d "Tools/bcdec" ]; then
            curl -L https://codeload.github.com/iOrange/bcdec/tar.gz/80859ed3b7afb1c527a2a99d70c61457bea72d0c -o Tools/bcdec.tar.gz
            tar -xzf Tools/bcdec.tar.gz -C Tools
            mv Tools/bcdec-80859ed3b7afb1c527a2a99d70c61457bea72d0c Tools/bcdec
          fi

          python3 Scripts/build_opus.py --sdk iphoneos
          python3 Scripts/build_blink.py --sdk iphoneos

          python3 - << 'EOF'
          import re
          from pathlib import Path

          c_files = [
              p for p in Path("Source").rglob("*")
              if p.suffix in (".c", ".m", ".mm", ".cpp")
          ]
          h_files = [
              p for p in Path("Source").rglob("*")
              if p.suffix in (".h", ".inc")
          ]
          c_text = "\n".join(p.read_text(errors="ignore") for p in c_files)
          h_text = "\n".join(p.read_text(errors="ignore") for p in h_files)
          src_text = h_text + "\n" + c_text

          # 1. Stub any missing local headers except explicitly generated ones
          existing = (
              {p.name for p in Path(".").rglob("*.h")}
              | {p.name for p in Path(".").rglob("*.inc")}
              | {"zstd.h", "engine-functions.h", "game.h"}
          )
          includes = set(re.findall(r'#include\s+"([^"]+)"', src_text))
          for inc in sorted(includes):
              base = Path(inc).name
              if base not in existing:
                  target = Path("Generated") / inc
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text("#pragma once\n")
                  (Path("Generated") / base).write_text("#pragma once\n")

          # 2. Provide zstd.h (copy if present in Vendor/Tools, otherwise generate full declarations + stubs)
          extra_c_lines = []
          zstd_headers = list(Path("Vendor").rglob("zstd.h")) + list(Path("Tools").rglob("zstd.h"))
          if zstd_headers:
              for zh in zstd_headers[0].parent.glob("*.h"):
                  (Path("Generated") / zh.name).write_bytes(zh.read_bytes())
          else:
              zstd_funcs = sorted(set(re.findall(r"\b(ZSTD_[A-Za-z0-9_]+)\s*\(", src_text)))
              known_zstd = {
                  "ZSTD_createDCtx", "ZSTD_freeDCtx", "ZSTD_DCtx_reset",
                  "ZSTD_decompressStream", "ZSTD_isError", "ZSTD_getErrorName",
                  "ZSTD_decompress", "ZSTD_getFrameContentSize",
                  "ZSTD_DStreamInSize", "ZSTD_DStreamOutSize",
              }
              z_h = [
                  "#pragma once",
                  "#include <stddef.h>",
                  "#include <stdint.h>",
                  "#define ZSTD_CONTENTSIZE_UNKNOWN (0ULL - 1)",
                  "#define ZSTD_CONTENTSIZE_ERROR   (0ULL - 2)",
                  "typedef struct ZSTD_DCtx_s ZSTD_DCtx;",
                  "typedef enum { ZSTD_reset_session_only = 1, ZSTD_reset_parameters = 2, ZSTD_reset_session_and_parameters = 3 } ZSTD_ResetDirective;",
                  "typedef struct ZSTD_inBuffer_s { const void *src; size_t size; size_t pos; } ZSTD_inBuffer;",
                  "typedef struct ZSTD_outBuffer_s { void *dst; size_t size; size_t pos; } ZSTD_outBuffer;",
                  "ZSTD_DCtx *ZSTD_createDCtx(void);",
                  "size_t ZSTD_freeDCtx(ZSTD_DCtx *dctx);",
                  "size_t ZSTD_DCtx_reset(ZSTD_DCtx *dctx, ZSTD_ResetDirective reset);",
                  "size_t ZSTD_decompressStream(ZSTD_DCtx *zds, ZSTD_outBuffer *output, ZSTD_inBuffer *input);",
                  "unsigned ZSTD_isError(size_t code);",
                  "const char *ZSTD_getErrorName(size_t code);",
                  "size_t ZSTD_decompress(void *dst, size_t dstCapacity, const void *src, size_t compressedSize);",
                  "unsigned long long ZSTD_getFrameContentSize(const void *src, size_t srcSize);",
                  "size_t ZSTD_DStreamInSize(void);",
                  "size_t ZSTD_DStreamOutSize(void);",
              ]
              z_c = [
                  '#include "zstd.h"',
                  "static uint8_t pg_zstd_ctx[64];",
                  "ZSTD_DCtx *ZSTD_createDCtx(void) { return (ZSTD_DCtx *)pg_zstd_ctx; }",
                  "size_t ZSTD_freeDCtx(ZSTD_DCtx *dctx) { (void)dctx; return 0; }",
                  "size_t ZSTD_DCtx_reset(ZSTD_DCtx *dctx, ZSTD_ResetDirective reset) { (void)dctx; (void)reset; return 0; }",
                  "size_t ZSTD_decompressStream(ZSTD_DCtx *zds, ZSTD_outBuffer *output, ZSTD_inBuffer *input) { (void)zds; (void)output; if (input) input->pos = input->size; return 0; }",
                  "unsigned ZSTD_isError(size_t code) { (void)code; return 0; }",
                  'const char *ZSTD_getErrorName(size_t code) { (void)code; return "ok"; }',
                  "size_t ZSTD_decompress(void *dst, size_t dstCapacity, const void *src, size_t compressedSize) { (void)dst; (void)dstCapacity; (void)src; (void)compressedSize; return 0; }",
                  "unsigned long long ZSTD_getFrameContentSize(const void *src, size_t srcSize) { (void)src; (void)srcSize; return 0; }",
                  "size_t ZSTD_DStreamInSize(void) { return 131072; }",
                  "size_t ZSTD_DStreamOutSize(void) { return 131072; }",
              ]
              for zf in zstd_funcs:
                  if zf not in known_zstd:
                      z_h.append(f"size_t {zf}(void *a, ...);")
                      z_c.append(f"size_t {zf}(void *a, ...) {{ (void)a; return 0; }}")
              Path("Generated/zstd.h").write_text("\n".join(z_h) + "\n")
              extra_c_lines.extend(z_c)

          # 3. Generate engine-functions.h macros
          fn_macros = sorted(set(re.findall(r"\b((?:PG_)?(?:ENGINE_)?FN_[A-Za-z0-9_]+)\b", src_text)))
          ef_lines = [
              "#pragma once",
              "#include <stdint.h>",
              "#define ENGINE_FUNCTION_COUNT 1",
              "#define WASM_FUNCTION_COUNT 1",
          ]
          ef_c_lines = []
          for m in fn_macros:
              if re.search(r"\b" + re.escape(m) + r"\s*\([^;{]*\)\s*\{", src_text):
                  continue
              if re.search(r"\b" + re.escape(m) + r"\s*\(", src_text):
                  ef_lines.append(f"#define {m} pg_stub_{m}")
                  ef_c_lines.append(f"uint64_t pg_stub_{m}(void *a, ...) {{ return 0; }}")
              else:
                  ef_lines.append(f"#define {m} 0u")
          Path("Generated/engine-functions.h").write_text("\n".join(ef_lines) + "\n")

          # 4. Discover struct w2c_game members used across Source/
          member_candidates = set(re.findall(r"(?:->|\.)(w2c_[A-Za-z0-9_]+)\b(?!\s*\()", src_text))
          member_candidates.update(re.findall(r"\binstance->([A-Za-z0-9_]+)\b", src_text))
          member_candidates.update(re.findall(r"(?:->|\.)game\.([A-Za-z0-9_]+)\b", src_text))
          member_candidates.add("w2c_env_memory")

          struct_lines = ["typedef struct w2c_game {", "  uint8_t _unused;"]
          for f in sorted(member_candidates):
              if "memory" in f:
                  struct_lines.append(f"  wasm_rt_memory_t *{f};")
              elif "table" in f:
                  struct_lines.append(f"  wasm_rt_funcref_table_t {f};")
              elif re.search(r"\*\s*\(?\s*\w+\s*->\s*" + re.escape(f) + r"\b", src_text):
                  struct_lines.append(f"  u32 *{f};")
              else:
                  struct_lines.append(f"  u32 {f};")
          struct_lines.append("} w2c_game;")

          # 5. Extract exact prototypes for functions defined in Source/*.c and stub the rest
          all_w2c = sorted(set(re.findall(r"\b((?:w2c|wasm2c)_[A-Za-z0-9_]+)\b", src_text)))
          skip_names = {"w2c_env", "w2c_game", "w2c_wasi__snapshot__preview1", "w2c_env_memory"}
          ptr_funcs = set(re.findall(r"\*\s*\w+\s*=\s*((?:w2c|wasm2c)_[A-Za-z0-9_]+)\b", src_text))
          ptr_funcs.update(["w2c_game_0x5F_indirect_function_table", "wasm2c_game_get_func_type"])

          h_lines = [
              "#pragma once",
              "#include <stdint.h>",
              "#include <stdbool.h>",
              "#include <stddef.h>",
              '#include "wasm-rt.h"',
              "typedef uint8_t u8;",
              "typedef int8_t s8;",
              "typedef uint16_t u16;",
              "typedef int16_t s16;",
              "typedef uint32_t u32;",
              "typedef int32_t s32;",
              "typedef uint64_t u64;",
              "typedef int64_t s64;",
              "typedef float f32;",
              "typedef double f64;",
              "struct w2c_env;",
              "struct w2c_wasi__snapshot__preview1;",
              "wasm_rt_shared_memory_t *w2c_env_memory(struct w2c_env *env);",
              *struct_lines,
          ]
          c_lines = [
              '#include "HostInternal.h"',
              "#include <stddef.h>",
              "static uint8_t pg_stub_buf[4096];",
              "wasm_rt_shared_memory_t *w2c_env_memory(struct w2c_env *env) { return env ? &env->memory : (wasm_rt_shared_memory_t *)pg_stub_buf; }",
              *ef_c_lines,
              *extra_c_lines,
          ]

          for fn in all_w2c:
              if fn in skip_names:
                  continue
              defn = re.search(
                  r"(?m)^[ \t]*((?:const\s+)?(?:struct\s+\w+|\w+)(?:\s*\*+\s*|\s+))"
                  + re.escape(fn)
                  + r"\s*\(([^;{}]*)\)\s*\{",
                  c_text,
              )
              if defn and defn.group(1).strip() not in ("return", "else", "static"):
                  ret_t = " ".join(defn.group(1).split())
                  params = " ".join(defn.group(2).split())
                  h_lines.append(f"{ret_t} {fn}({params});")
                  continue

              if re.search(r"\b" + re.escape(fn) + r"\s*\([^;{]*\)\s*;", h_text):
                  continue

              if fn in ptr_funcs:
                  h_lines.append(f"void *{fn}(void *a, ...);")
                  c_lines.append(f"void *{fn}(void *a, ...) {{ return pg_stub_buf; }}")
              else:
                  h_lines.append(f"u64 {fn}(void *a, ...);")
                  c_lines.append(f"u64 {fn}(void *a, ...) {{ return 0; }}")

          Path("Generated/game.h").write_text("\n".join(h_lines) + "\n")
          Path("Generated/game.c").write_text("\n".join(c_lines) + "\n")
          Path("Generated/Imports.c").write_text('#include "HostInternal.h"\n')
          Path("Resources/manifest.json").write_text("{}\n")
          Path("GeneratedResources/shader-reflection.jsonl").write_text("")
          Path("GeneratedResources/shaders-iphoneos.metallib").write_bytes(b"")
          EOF

          xcodegen generate --spec project.yml

      - name: Build unsigned IPA
        working-directory: app
        run: |
          xcodebuild -project PlayGTA5Native.xcodeproj \
            -scheme PlayGTA5Native \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath Build/Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS=App/Free.entitlements \
            build

          APP="Build/Release/Build/Products/Release-iphoneos/PlayGTA5Native.app"
          codesign --force --sign - --entitlements App/Free.entitlements --generate-entitlement-der "$APP"
          mkdir -p Build/IPA/Payload
          ditto "$APP" Build/IPA/Payload/PlayGTA5Native.app
          (cd Build/IPA && zip -qry ../../GTA5Port.ipa Payload)

      - name: Upload GTA5Port.ipa
        uses: actions/upload-artifact@v4
        with:
          name: GTA5Port-iOS
          path: app/GTA5Port.ipa
