name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare dependencies and engine stubs
        working-directory: app
        run: |
          mkdir -p Tools Generated Generated/zstd Build/zstd_obj Resources GeneratedResources

          # 1. WABT runtime
          if [ ! -d "Tools/wabt-1.0.42" ]; then
            curl -fL https://github.com/WebAssembly/wabt/releases/download/1.0.42/wabt-1.0.42-macos-arm64.tar.gz -o Tools/wabt.tar.gz
            tar -xzf Tools/wabt.tar.gz -C Tools
          fi

          # 2. SIMDe
          if [ ! -d "Tools/simde" ]; then
            git clone --depth 1 --branch v0.8.2 https://github.com/simd-everywhere/simde.git Tools/simde
          fi

          # 3. bcdec
          mkdir -p Tools/bcdec
          if [ ! -s "Tools/bcdec/bcdec.h" ]; then
            git clone --depth 1 https://github.com/iOrange/bcdec.git Tools/bcdec_tmp && cp Tools/bcdec_tmp/bcdec.h Tools/bcdec/bcdec.h || true
          fi
          if [ ! -s "Tools/bcdec/bcdec.h" ]; then
            curl -fL https://raw.githubusercontent.com/iOrange/bcdec/master/bcdec.h -o Tools/bcdec/bcdec.h
          fi
          test -s Tools/bcdec/bcdec.h

          # 4. Official Zstandard (zstd) headers & static library for iOS arm64
          if [ ! -d "Tools/zstd-1.5.6" ]; then
            curl -fL https://github.com/facebook/zstd/releases/download/v1.5.6/zstd-1.5.6.tar.gz -o Tools/zstd.tar.gz
            tar -xzf Tools/zstd.tar.gz -C Tools
          fi
          cp Tools/zstd-1.5.6/lib/*.h Generated/
          cp Tools/zstd-1.5.6/lib/*.h Generated/zstd/

          if ! grep -q '#include "zstd.h"' Source/NativeDecompress.c; then
            printf '#include "zstd.h"\n' | cat - Source/NativeDecompress.c > Source/NativeDecompress.c.tmp
            mv Source/NativeDecompress.c.tmp Source/NativeDecompress.c
          fi

          IOS_CC=$(xcrun --sdk iphoneos -f clang)
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          for src in Tools/zstd-1.5.6/lib/common/*.c Tools/zstd-1.5.6/lib/decompress/*.c; do
            obj="Build/zstd_obj/$(basename "${src%.c}").o"
            "$IOS_CC" -arch arm64 -isysroot "$IOS_SDK" -mios-version-min=16.0 -O2 \
              -DZSTD_DISABLE_ASM=1 -ITools/zstd-1.5.6/lib -ITools/zstd-1.5.6/lib/common \
              -c "$src" -o "$obj"
          done
          xcrun --sdk iphoneos ar rcs Tools/libzstd.a Build/zstd_obj/*.o

          # 5. Native audio & network libs
          python3 Scripts/build_opus.py --sdk iphoneos
          python3 Scripts/build_blink.py --sdk iphoneos

          # 6. Generate matching engine headers and weak stubs (prevents duplicate symbol errors)
          python3 - << 'EOF'
          import re
          from pathlib import Path

          c_files = [
              p for p in Path("Source").rglob("*")
              if p.suffix in (".c", ".m", ".mm", ".cpp")
          ]
          h_files = [
              p for p in Path("Source").rglob("*")
              if p.suffix in (".h", ".inc")
          ]
          app_files = [
              p for p in Path("App").rglob("*")
              if p.suffix in (".c", ".h", ".m", ".mm", ".cpp", ".swift")
          ] if Path("App").exists() else []

          c_text = "\n".join(p.read_text(errors="ignore") for p in c_files)
          h_text = "\n".join(p.read_text(errors="ignore") for p in h_files)
          app_text = "\n".join(p.read_text(errors="ignore") for p in app_files)
          src_text = h_text + "\n" + c_text
          all_text = src_text + "\n" + app_text

          # Stub any missing local headers
          existing = (
              {p.name for p in Path(".").rglob("*.h")}
              | {p.name for p in Path(".").rglob("*.inc")}
              | {"engine-functions.h", "game.h"}
          )
          includes = set(re.findall(r'#include\s+"([^"]+)"', src_text))
          for inc in sorted(includes):
              base = Path(inc).name
              if base not in existing:
                  target = Path("Generated") / inc
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text("#pragma once\n")
                  (Path("Generated") / base).write_text("#pragma once\n")

          # Generate engine-functions.h macros
          fn_macros = sorted(set(re.findall(r"\b((?:PG_)?(?:ENGINE_)?FN_[A-Za-z0-9_]+)\b", all_text)))
          ef_lines = [
              "#pragma once",
              "#include <stdint.h>",
              "#define ENGINE_FUNCTION_COUNT 1",
              "#define WASM_FUNCTION_COUNT 1",
          ]
          ef_c_lines = []
          for m in fn_macros:
              if re.search(r"\b" + re.escape(m) + r"\s*\([^;{]*\)\s*\{", src_text):
                  continue
              if re.search(r"\b" + re.escape(m) + r"\s*\(", all_text):
                  ef_lines.append(f"#define {m} pg_stub_{m}")
                  ef_c_lines.append(f"__attribute__((weak)) uint64_t pg_stub_{m}(void *a, ...) {{ return 0; }}")
              else:
                  ef_lines.append(f"#define {m} 0u")
          Path("Generated/engine-functions.h").write_text("\n".join(ef_lines) + "\n")

          # Discover struct w2c_game members
          member_candidates = set(re.findall(r"(?:->|\.)(w2c_[A-Za-z0-9_]+)\b(?!\s*\()", src_text))
          member_candidates.update(re.findall(r"\binstance->([A-Za-z0-9_]+)\b", src_text))
          member_candidates.update(re.findall(r"(?:->|\.)game\.([A-Za-z0-9_]+)\b", src_text))
          member_candidates.add("w2c_env_memory")

          struct_lines = ["typedef struct w2c_game {", "  uint8_t _unused;"]
          for f in sorted(member_candidates):
              if "memory" in f:
                  struct_lines.append(f"  wasm_rt_memory_t *{f};")
              elif "table" in f:
                  struct_lines.append(f"  wasm_rt_funcref_table_t {f};")
              elif re.search(r"\*\s*\(?\s*\w+\s*->\s*" + re.escape(f) + r"\b", src_text):
                  struct_lines.append(f"  u32 *{f};")
              else:
                  struct_lines.append(f"  u32 {f};")
          struct_lines.append("} w2c_game;")

          # Find pagesize / constant wasm2c symbols vs callable functions
          pagesize_syms = sorted(set(re.findall(r"\b(wasm2c_[A-Za-z0-9_]*pagesize[A-Za-z0-9_]*)\b", all_text)))
          pagesize_syms.append("wasm2c_game_pagesize_env_memory")
          pagesize_syms = sorted(set(pagesize_syms))

          called_w2c = set(re.findall(r"\b((?:w2c|wasm2c)_[A-Za-z0-9_]+)\b(?=\s*\()", all_text))
          ptr_funcs = set(re.findall(r"\*\s*\w+\s*=\s*((?:w2c|wasm2c)_[A-Za-z0-9_]+)\b", all_text))
          ptr_funcs.update(["w2c_game_0x5F_indirect_function_table", "wasm2c_game_get_func_type"])
          all_funcs = sorted(called_w2c | ptr_funcs)

          skip_names = (
              {"w2c_env", "w2c_game", "w2c_wasi__snapshot__preview1", "w2c_env_memory"}
              | member_candidates
              | set(pagesize_syms)
          )

          h_lines = [
              "#pragma once",
              "#include <stdint.h>",
              "#include <stdbool.h>",
              "#include <stddef.h>",
              '#include "wasm-rt.h"',
              "typedef uint8_t u8;",
              "typedef int8_t s8;",
              "typedef uint16_t u16;",
              "typedef int16_t s16;",
              "typedef uint32_t u32;",
              "typedef int32_t s32;",
              "typedef uint64_t u64;",
              "typedef int64_t s64;",
              "typedef float f32;",
              "typedef double f64;",
              "struct w2c_env;",
              "struct w2c_wasi__snapshot__preview1;",
              "wasm_rt_shared_memory_t *w2c_env_memory(struct w2c_env *env);",
              *[f"#define {ps} 65536u" for ps in pagesize_syms],
              *struct_lines,
              "static void pg_asi_dummy_handler(w2c_game *g, u64 c) { (void)g; (void)c; }",
              "static const struct { uint64_t hash; void (*handler)(w2c_game *, u64); } pg_asi_natives[] = { { 0ULL, pg_asi_dummy_handler } };",
          ]
          c_lines = [
              '#include "HostInternal.h"',
              "#include <stddef.h>",
              "static uint8_t pg_stub_buf[4096];",
              "__attribute__((weak)) wasm_rt_shared_memory_t *w2c_env_memory(struct w2c_env *env) { return env ? &env->memory : (wasm_rt_shared_memory_t *)pg_stub_buf; }",
              *ef_c_lines,
          ]

          for fn in all_funcs:
              if fn in skip_names:
                  continue
              defn = re.search(
                  r"(?m)^[ \t]*((?:const\s+)?(?:struct\s+\w+|\w+)(?:\s*\*+\s*|\s+))"
                  + re.escape(fn)
                  + r"\s*\(([^;{}]*)\)\s*\{",
                  c_text,
              )
              if defn and defn.group(1).strip() not in ("return", "else", "static"):
                  ret_t = " ".join(defn.group(1).split())
                  params = " ".join(defn.group(2).split())
                  h_lines.append(f"{ret_t} {fn}({params});")
                  continue

              if re.search(r"\b" + re.escape(fn) + r"\s*\([^;{]*\)\s*;", h_text):
                  continue

              if fn in ptr_funcs:
                  h_lines.append(f"void *{fn}(void *a, ...);")
                  c_lines.append(f"__attribute__((weak)) void *{fn}(void *a, ...) {{ return pg_stub_buf; }}")
              else:
                  h_lines.append(f"u64 {fn}(void *a, ...);")
                  c_lines.append(f"__attribute__((weak)) u64 {fn}(void *a, ...) {{ return 0; }}")

          Path("Generated/game.h").write_text("\n".join(h_lines) + "\n")
          Path("Generated/game.c").write_text("\n".join(c_lines) + "\n")
          Path("Generated/Imports.c").write_text('#include "HostInternal.h"\n')
          Path("Resources/manifest.json").write_text("{}\n")
          Path("GeneratedResources/shader-reflection.jsonl").write_text("")
          Path("GeneratedResources/shaders-iphoneos.metallib").write_bytes(b"")
          EOF

          xcodegen generate --spec project.yml

      - name: Build unsigned IPA
        working-directory: app
        run: |
          ZSTD_LD=""
          if ! nm -gU Vendor/libarchive.xcframework/ios-arm64/libarchive.a 2>/dev/null | grep -q ZSTD_createDCtx; then
            ZSTD_LD='$(SRCROOT)/Tools/libzstd.a'
          fi

          xcodebuild -project PlayGTA5Native.xcodeproj \
            -scheme PlayGTA5Native \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath Build/Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS=App/Free.entitlements \
            OTHER_LDFLAGS="\$(inherited) $ZSTD_LD" \
            build

          APP="Build/Release/Build/Products/Release-iphoneos/PlayGTA5Native.app"
          codesign --force --sign - --entitlements App/Free.entitlements --generate-entitlement-der "$APP"
          mkdir -p Build/IPA/Payload
          ditto "$APP" Build/IPA/Payload/PlayGTA5Native.app
          (cd Build/IPA && zip -qry ../../GTA5Port.ipa Payload)

      - name: Upload GTA5Port.ipa
        uses: actions/upload-artifact@v4
        with:
          name: GTA5Port-iOS
          path: app/GTA5Port.ipa
